<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>江城钓客 · 武汉江湖 3D 垂钓</title>
<style>
:root {
  --c-bg: #0d1420; --c-panel: #141d2ecc; --c-text: #dce8f2; --c-dim: #8a9aa8;
  --c-good: #6fd08c; --c-bad: #e07a6a; --c-gold: #e8b44a;
  --cursor-point: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='30' height='30' viewBox='0 0 30 30'><path d='M11 3c1.1 0 2 .9 2 2v9l2.4-1.2c2.4-1.2 5.3.3 5.3 3v.8c0 3.4-1.4 6.6-3.9 8.9l-.8.7c-1 .9-2.3 1.4-3.7 1.4h-2.6c-2 0-3.9-1-5-2.7l-2.6-4C1.4 20.5 2 18 4 17l3-1.8V5c0-1.1.9-2 2-2h2z' fill='%23ffd98a' stroke='%23332a10' stroke-width='1.6' stroke-linejoin='round'/></svg>") 6 2, auto;
  --cursor-grab: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><path d='M9 4c1 0 1.8.7 2 1.6l.4 6.9L13 6c.3-1 1.4-1.6 2.4-1.2 1 .3 1.5 1.3 1.3 2.3l-1 6.6 3.6-5c.5-.9 1.7-1.1 2.5-.5.8.5 1 1.6.6 2.4l-2.6 6.1 4.6-3.3c.9-.6 2.1-.3 2.6.6.4.9.2 1.9-.6 2.4l-5.3 4.3-1.2 1c-1.5 1.2-3.4 1.9-5.3 1.9h-1.3c-2.6 0-5-1.4-6.2-3.7l-2-3.7c-.6-1.1-.2-2.5.9-3.1l.7-.4V6c0-1.1.9-2 2-2z' fill='%23ffb84a' stroke='%23332a10' stroke-width='1.6' stroke-linejoin='round'/></svg>") 10 4, auto;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--c-bg); }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: var(--c-text); cursor: var(--cursor-point); }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#game:default { cursor: none; }
#ui-root { position: fixed; inset: 0; pointer-events: none; font-size: 14px; cursor: var(--cursor-point); }
#ui-root button { pointer-events: auto; cursor: var(--cursor-grab); font-family: inherit; }
#ui-root .mini-card, #ui-root .map-spot, #ui-root .dex-g, #ui-root .shop-row button,
#ui-root .real-pin, #ui-root .ms-go, #ui-root #btn-claim { cursor: var(--cursor-grab); }
b { color: #ffd98a; font-weight: 600; }
b.warn, .warn { color: #ff9a7a; }

/* ===== 标题 ===== */
#title-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: linear-gradient(180deg, #0d142066, #0d1420cc); }
.title-box { text-align: center; padding: 40px 60px; }
.game-title { font-size: 72px; font-weight: 900; letter-spacing: 14px; color: #f4ead2; text-shadow: 0 4px 30px #2a6080aa, 0 2px 4px #000; }
.game-sub { margin: 14px 0 30px; color: var(--c-dim); letter-spacing: 3px; }
.title-btns { display: flex; gap: 18px; justify-content: center; margin-bottom: 28px; }
.title-btns button, .big-btn { padding: 13px 38px; font-size: 19px; border: 1px solid #3a5a78; border-radius: 8px; background: linear-gradient(180deg, #1d3a52, #14283a); color: #eaf4fc; transition: .15s; }
.title-btns button:hover, .big-btn:hover { border-color: var(--c-gold); color: var(--c-gold); transform: translateY(-1px); }
.title-help { color: #7a8ea0; font-size: 13px; line-height: 2; }

/* ===== HUD ===== */
#status-bar { position: absolute; top: 14px; left: 16px; display: flex; gap: 16px; background: var(--c-panel); padding: 8px 16px; border-radius: 8px; border: 1px solid #2a3a4a; backdrop-filter: blur(4px); }
#st-money { color: var(--c-gold); font-weight: 700; }
#btn-bar { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; }
#btn-bar button { padding: 7px 13px; font-size: 13px; border-radius: 6px; border: 1px solid #3a4a5a; background: #16212ecc; color: var(--c-text); }
#btn-bar button:hover { border-color: var(--c-gold); color: var(--c-gold); }
#lock-hint { position: absolute; top: 54%; left: 50%; transform: translateX(-50%); color: #fff; background: #00000088; padding: 10px 22px; border-radius: 20px; display: none; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .55; } }

#center-group { position: absolute; bottom: 118px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
#prompt { background: #0d141eee; padding: 9px 22px; border-radius: 18px; border: 1px solid #2a3a4a; max-width: 92vw; text-align: center; }
#charge-wrap { display: none; width: 320px; background: #0d141eee; border: 1px solid #3a5a78; border-radius: 6px; padding: 3px; position: relative; }
#charge-bar { height: 14px; border-radius: 4px; background: linear-gradient(90deg, #5fb85f, #e8c44a, #e05a3a); width: 0; transition: width .05s linear; }
#charge-text { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 20px; color: #fff; text-shadow: 0 1px 2px #000; }
#fight-wrap { display: none; flex-direction: column; gap: 5px; width: 380px; background: #0d141ecc; padding: 10px 14px; border-radius: 10px; border: 1px solid #3a4a5a; }
.fbar { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.fbar label { width: 34px; color: var(--c-dim); }
.ftrack { flex: 1; height: 10px; background: #1a2430; border-radius: 5px; overflow: hidden; }
#tension-bar { height: 100%; width: 0; background: linear-gradient(90deg, #4da06a, #d8c44a); border-radius: 5px; }
#tension-bar.warn { background: #e8a04a; }
#tension-bar.danger { background: #e04a3a; animation: blink .3s infinite; }
#stamina-bar { height: 100%; width: 0; background: #4d9de0; border-radius: 5px; }
@keyframes blink { 50% { opacity: .5; } }
#fight-info { text-align: center; font-size: 13px; color: var(--c-dim); }
#fight-info .land { color: var(--c-good); font-size: 15px; animation: pulse .8s infinite; }

#tackle-bar { position: absolute; left: 16px; bottom: 14px; background: var(--c-panel); border: 1px solid #2a3a4a; border-radius: 10px; padding: 10px 14px; min-width: 250px; }
#mode-tabs { display: flex; gap: 8px; margin-bottom: 8px; }
#mode-tabs button { flex: 1; padding: 6px 4px; font-size: 14px; border-radius: 6px; border: 1px solid #3a4a5a; background: #16212e; color: var(--c-dim); }
#mode-tabs button.active { border-color: var(--c-gold); color: var(--c-gold); background: #2a2410; }
#mode-tabs i { font-style: normal; font-size: 10px; opacity: .6; margin-left: 3px; }
#tackle-line1 { display: flex; gap: 14px; font-size: 13px; align-items: center; }
#tk-bait b { color: #6aa8d8; font-size: 11px; margin: 0 4px; }
.lack #tk-bait-name, .lack #tk-bait-n { color: #e07a6a; }
#tk-chum { color: var(--c-dim); font-size: 12px; }
#tk-chum i { font-style: normal; font-size: 11px; }
#tk-depth { margin-top: 6px; font-size: 12px; color: #9ec4e0; min-height: 16px; }

#bite-hint { position: absolute; top: 33%; left: 50%; transform: translate(-50%, 0) scale(.8); font-size: 30px; font-weight: 800; color: #ffdf8a; text-shadow: 0 0 18px #c0702088, 0 2px 4px #000; opacity: 0; pointer-events: none; }
#bite-hint.show { animation: bitepop 1.6s ease-out; }
@keyframes bitepop { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.7); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.12); } 22% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

#toasts { position: absolute; top: 66px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.toast { background: #101820ee; border: 1px solid #3a4a5a; border-left: 4px solid #6a8aa8; padding: 8px 18px; border-radius: 8px; animation: tin .25s ease-out; max-width: 70vw; }
.toast.good { border-left-color: var(--c-good); }
.toast.bad { border-left-color: var(--c-bad); }
.toast.out { opacity: 0; transition: .5s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* ===== 面板 ===== */
#panel { position: absolute; inset: 0; background: #060a10bb; display: none; align-items: center; justify-content: center; pointer-events: auto; }
#panel-box { width: min(1020px, 94vw); height: min(680px, 90vh); background: #101923; border: 1px solid #2e4256; border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 80px #000c; }
#panel-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid #22303e; font-size: 18px; font-weight: 700; }
#panel-close { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a4a5a; background: #16212e; color: var(--c-dim); font-size: 13px; }
#panel-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
#panel-body::-webkit-scrollbar { width: 8px; }
#panel-body::-webkit-scrollbar-thumb { background: #2a3a4a; border-radius: 4px; }

/* 图鉴 */
.dex-wrap { display: flex; gap: 16px; height: 100%; }
.dex-side { width: 190px; flex-shrink: 0; overflow-y: auto; }
.dex-total { font-size: 15px; color: var(--c-gold); margin-bottom: 8px; }
.dex-g { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 6px; cursor: pointer; color: var(--c-dim); pointer-events: auto; }
.dex-g:hover { background: #1a2530; }
.dex-g.on { background: #22364a; color: #eaf4fc; }
.dex-p { font-size: 12px; }
.dex-main { flex: 1; display: flex; flex-direction: column; }
.dex-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.dex-head .dex-p2 { color: var(--c-dim); }
#btn-claim { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--c-gold); color: var(--c-gold); background: #2a2410; animation: pulse 1.5s infinite; }
.claimed { color: var(--c-good); font-size: 13px; }
.dex-tip { color: #96a8b8; font-size: 12px; margin-top: 10px; }

.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.card-grid.big { display: flex; flex-direction: column; gap: 14px; }
.mini-card { border-radius: 10px; padding: 7px; text-align: center; cursor: pointer; pointer-events: auto; border: 2px solid #3a4a5a; background: #16212c; position: relative; transition: transform .12s; }
.mini-card:hover { transform: translateY(-3px); }
.mini-card img { width: 100%; height: 84px; object-fit: contain; }
.mini-card .mc-img { height: 84px; line-height: 84px; font-size: 40px; filter: brightness(0.12); }
.mini-card .mc-name { font-size: 13px; margin-top: 2px; }
.mini-card .mc-sub { font-size: 11px; color: var(--c-dim); }
.mini-card .mc-grade { position: absolute; top: 4px; left: 6px; font-size: 10px; padding: 1px 6px; border-radius: 8px; background: #000a; }
.mini-card.locked { opacity: .75; }
/* 四色卡：白/蓝/紫/橙——底色边框双强化 */
.fishcard.g1, .mini-card.g1 { background: linear-gradient(165deg,#e8ecf0,#b8c2cc) !important; border-color: #f0f4f8; }
.fishcard.g1 .fc-name, .fishcard.g1 .fc-latin, .fishcard.g1 .fc-stats, .fishcard.g1 .fc-meta { color: #2a3440; }
.fishcard.g2, .mini-card.g2 { background: linear-gradient(165deg,#1d3f66,#122844) !important; border: 2px solid #4d9de0; box-shadow: 0 0 10px #4d9de044; }
.fishcard.g3, .mini-card.g3 { background: linear-gradient(165deg,#43255e,#291a3d) !important; border: 2px solid #b06ae0; box-shadow: 0 0 12px #b06ae055; }
.fishcard.g4, .mini-card.g4 { background: linear-gradient(165deg,#5e4215,#3d2c0e) !important; border: 2px solid var(--c-gold); box-shadow: 0 0 16px #e8b44a66; }
.mini-card.g1 { border: 2px solid #dfe6ec; }
.mini-card.g1 .mc-name { color: #2a3440; }
.mini-card.g1 .mc-sub { color: #4a5662; }
.g1 { border-color: #c8d0d8; } .g2 { border-color: #4d9de0; } .g3 { border-color: #b06ae0; }
.g4 { border-color: var(--c-gold); }
.g1 .mc-grade { color: #dfe6ec; } .g2 .mc-grade { color: #4d9de0; } .g3 .mc-grade { color: #b06ae0; }
.g4 .mc-grade { color: var(--c-gold); }

/* 卡册分解/合成按钮 */
.mc-btns { display: flex; gap: 4px; justify-content: center; margin-top: 5px; }
.card-btn { font-size: 10px; padding: 2px 6px; border-radius: 5px; border: 1px solid #3a4a5a; background: #16212e; color: #9ecfe8; cursor: pointer; pointer-events: auto; }
.card-btn.sal:hover { border-color: #e07a6a; color: #e0a09a; }
.card-btn.up:hover { border-color: var(--c-gold); color: var(--c-gold); }
.card-btn.max { border: none; color: var(--c-gold); font-size: 10px; }
.shard-box { color: #b8e0f0; }
.shard-box b { color: #7fd0e8; }
.album-tip { font-size: 12px; color: var(--c-dim); margin-bottom: 12px; line-height: 1.8; }

/* 成就页 */
.achv-head { font-size: 16px; margin-bottom: 14px; }
.achv-head b { color: var(--c-gold); }
.achv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
.achv-badge { border: 1px solid #263442; border-radius: 10px; padding: 12px 10px; text-align: center; opacity: 0.45; }
.achv-badge.on { opacity: 1; border-color: var(--c-gold); background: #1c1a10; }
.ab-icon { font-size: 26px; }
.ab-name { font-weight: 700; margin: 4px 0 2px; }
.ab-desc { font-size: 11px; color: var(--c-dim); line-height: 1.5; }
.achv-fish-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; color: #cddcea; }
.achv-group { margin-bottom: 14px; }
.achv-tb { width: 100%; border-collapse: collapse; }
.achv-tb td { padding: 5px 10px; border-bottom: 1px solid #1c2834; font-size: 13px; }
.achv-tb tr.none td { opacity: 0.45; }
.achv-tb td:nth-child(3) { color: var(--c-dim); text-align: right; }
.card-tag { font-size: 11px; padding: 1px 8px; border-radius: 8px; border: 1px solid; }
.g1t { color: #dfe6ec; border-color: #c8d0d8; }
.g2t { color: #4d9de0; border-color: #4d9de0; }
.g3t { color: #b06ae0; border-color: #b06ae0; }
.g4t { color: var(--c-gold); border-color: var(--c-gold); }
.nocard { color: #5a6a78; font-size: 12px; }

/* 钓鱼地图 */
.map-wrap { display: flex; gap: 16px; height: 100%; }
.map-left { width: 54%; flex-shrink: 0; position: relative; }
#realmap { width: 100%; height: 100%; min-height: 420px; border-radius: 12px; border: 1px solid #2a3a4a; background: #141d28; overflow: hidden; }
.map-fallback { display: none; width: 100%; height: 100%; }
#realmap .leaflet-container { background: #141d28; }
.real-pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; white-space: nowrap; }
.real-pin .rp-dot { width: 14px; height: 14px; border-radius: 50%; background: #4d9de0; border: 3px solid #fff; box-shadow: 0 2px 6px #000a; }
.real-pin.on .rp-dot { background: #e8a838; box-shadow: 0 0 10px #e8b44a; }
.real-pin .rp-name { font-size: 13px; font-weight: 700; color: #fff; background: #10202ee0; padding: 1px 8px; border-radius: 8px; margin-top: 2px; pointer-events: none; }
.real-pin:hover .rp-name { background: #3a3010e0; color: #ffd98a; }
.real-player { font-size: 13px; font-weight: 700; color: #b8f0c8; background: #103020e0; border: 1px solid #4d9de0; padding: 2px 8px; border-radius: 10px; transform: translate(-50%, -120%); position: absolute; }
.wuhan-map { width: 100%; height: 100%; background: #141d28; border-radius: 12px; border: 1px solid #2a3a4a; }
.map-pin circle { fill: #4d9de0; cursor: pointer; stroke: #fff; stroke-width: 1.5; }
.map-pin text { fill: #dce8f2; font-size: 15px; font-weight: 700; paint-order: stroke; stroke: #0d1420; stroke-width: 3; cursor: pointer; }
.map-pin:hover circle { fill: #ffd98a; }
.map-pin.on circle { fill: #e8a838; }
.map-player circle { fill: #6fd08c; }
.map-player text { fill: #b8f0c8; font-size: 13px; font-weight: 700; paint-order: stroke; stroke: #0d1420; stroke-width: 3; }
.map-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 6px; }
.map-spot { border: 1px solid #263442; border-radius: 10px; padding: 10px 14px; }
.map-spot.on { border-color: var(--c-gold); background: #1c1a10; }
.ms-head { display: flex; align-items: center; gap: 8px; }
.ms-icon { font-size: 18px; }
.ms-zone { font-size: 11px; color: var(--c-dim); border: 1px solid #2a3a4a; padding: 1px 8px; border-radius: 8px; }
.ms-cur { font-size: 12px; color: var(--c-gold); }
.ms-desc { font-size: 12px; color: #b8c8d8; margin: 6px 0 4px; line-height: 1.6; }
.ms-fish { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.fish-chip { font-size: 11px; color: #9ecfe8; border: 1px solid #2a4a5a; background: #12202c; padding: 1px 7px; border-radius: 9px; }
.fish-chip.dim { color: #6a7a88; border-style: dashed; }
.ms-tip { font-size: 12px; color: var(--c-dim); margin-top: 3px; }
.ms-go { margin-top: 7px; padding: 5px 18px; font-size: 13px; border-radius: 6px; border: 1px solid #3a6a8a; background: #14283a; color: #9ecfe8; }
.ms-go:hover { border-color: var(--c-gold); color: var(--c-gold); }
.map-note { font-size: 12px; color: #5a6a78; line-height: 1.7; padding: 4px 2px; }

/* 详情 */
.detail-box { display: flex; gap: 22px; }
.detail-card { width: 230px; padding: 14px; border-radius: 12px; text-align: center; font-size: 16px; align-self: flex-start; }
.detail-card img { width: 100%; }
.detail-info { flex: 1; }
.detail-info h3 { font-size: 22px; margin-bottom: 8px; }
.detail-info h3 small { color: var(--c-dim); font-size: 12px; font-weight: 400; margin-left: 8px; font-style: italic; }
.detail-info p { color: #b8c8d8; line-height: 1.8; margin-bottom: 14px; }
.detail-info table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
.detail-info td { padding: 7px 10px; border-bottom: 1px solid #22303e; font-size: 13px; }
.detail-info td:nth-child(odd) { color: var(--c-dim); width: 90px; }
#detail-back { padding: 8px 22px; border-radius: 6px; border: 1px solid #3a4a5a; background: #16212e; color: var(--c-text); }

/* 卡册 */
.album-head { display: flex; justify-content: space-between; color: var(--c-dim); margin-bottom: 14px; }
.album-gtitle { color: #cddcea; font-weight: 700; margin-bottom: 8px; }
.empty-tip { color: #96a8b8; text-align: center; padding: 60px 0; font-size: 15px; }

/* 商店 */
.shop-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.shop-tabs button { padding: 7px 16px; border-radius: 6px; border: 1px solid #3a4a5a; background: #16212e; color: var(--c-dim); }
.shop-tabs button.on { border-color: var(--c-gold); color: var(--c-gold); }
.shop-money { margin-bottom: 12px; color: var(--c-dim); }
.shop-money b { color: var(--c-gold); }
.shop-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 11px 14px; border: 1px solid #22303e; border-radius: 8px; margin-bottom: 8px; }
.sr-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sr-info b { line-height: 1.4; }
.sr-info span { display: block; color: #9aabba; font-size: 12px; line-height: 1.55; }
.sr-info .sr-len { color: #9ec4e0; }
.sr-act { flex-shrink: 0; }
.sr-act button { padding: 7px 18px; border-radius: 6px; border: 1px solid #3a6a8a; background: #14283a; color: #9ecfe8; }
.sr-act button:hover { border-color: var(--c-gold); color: var(--c-gold); }
.equipped { color: var(--c-good); font-size: 13px; }

/* 渔护 */
.bag-head { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; color: var(--c-dim); }
.bag-head b { color: var(--c-gold); }
.bag-head button { padding: 8px 20px; border-radius: 6px; border: 1px solid #3a6a8a; background: #14283a; color: #9ecfe8; }
.bag-head button:disabled { opacity: .4; cursor: default; }
.bag-row { display: flex; align-items: center; gap: 14px; padding: 8px 12px; border-bottom: 1px solid #1c2834; }
.bag-row img { width: 46px; height: 34px; object-fit: contain; }
.br-name { flex: 1; }
.br-val { color: var(--c-gold); }

/* 帮助 */
.help-cols { display: flex; gap: 30px; }
.help-cols > div { flex: 1; }
.help-tb { border-collapse: collapse; width: 100%; }
.help-tb td { padding: 7px 10px; border-bottom: 1px solid #22303e; font-size: 13px; }
.help-tb td:first-child { color: #ffd98a; width: 170px; }
.help-ul { list-style: none; }
.help-ul li { padding: 9px 0 9px 18px; border-bottom: 1px solid #22303e; line-height: 1.8; font-size: 13px; color: #b8c8d8; position: relative; }
.help-ul li::before { content: '🎣'; position: absolute; left: -6px; font-size: 11px; }

/* ===== 开卡 ===== */
#catch-overlay { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #0a1018e6, #05080de8); display: none; align-items: center; justify-content: center; pointer-events: auto; }
.catch-stage { text-align: center; animation: cardin .5s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes cardin { from { transform: scale(.5) rotate(-6deg); opacity: 0; } }
.first-banner { font-size: 26px; font-weight: 900; color: #8ad0ff; margin-bottom: 18px; text-shadow: 0 0 24px #2a80c0aa; animation: pulse 1.2s infinite; }
.fishcard { width: 270px; margin: 0 auto; border-radius: 14px; padding: 16px 14px 12px; position: relative; overflow: hidden; border: 3px solid; }
.fishcard img { width: 100%; height: 190px; object-fit: contain; }
.fc-grade { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
.fc-name { font-size: 24px; font-weight: 900; margin-top: 4px; }
.fc-latin { font-size: 11px; font-style: italic; color: var(--c-dim); }
.fc-stats { font-size: 15px; margin-top: 8px; color: #ffd98a; }
.fc-meta { font-size: 12px; color: var(--c-dim); margin-top: 2px; }
.fc-badges { margin-top: 8px; min-height: 22px; }
.badge { display: inline-block; margin: 0 3px; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; }
.badge.first { background: #2a5a8a; color: #bde4ff; }
.badge.rec { background: #2a6a3a; color: #b8f0c8; }
.badge.big { background: #6a4a10; color: #ffd98a; }
.badge.rel { background: #1a5a3a; color: #a0e8c0; }
.fishcard.g4::after, .mini-card.g4::after { content: ''; position: absolute; inset: -60%; background: linear-gradient(115deg, transparent 42%, #ffffff55 50%, transparent 58%); animation: shine 2.6s infinite; pointer-events: none; }
@keyframes shine { 0% { transform: translateX(-80%); } 55%, 100% { transform: translateX(80%); } }
.catch-value { margin: 18px 0; font-size: 16px; color: #cddcea; }
.catch-btns button.big-btn { font-size: 17px; }

/* ===== 小窗口与图形能力兜底 ===== */
@media (max-width: 1100px) {
  #status-bar { gap: 10px; padding: 8px 10px; font-size: 12px; }
  #btn-bar { gap: 6px; }
  #btn-bar button { padding: 7px 9px; font-size: 12px; }
}
@media (max-width: 860px) {
  #status-bar { top: 14px; left: 16px; right: 16px; justify-content: space-between; gap: 8px; white-space: nowrap; }
  #btn-bar { top: 54px; left: 16px; right: 16px; justify-content: flex-end; flex-wrap: wrap; }
  #toasts { top: 100px; }
  .shop-row { align-items: flex-start; }
  .help-cols { gap: 18px; }
  .help-tb td:first-child { width: 145px; }
}
@media (max-width: 560px) {
  #status-bar { flex-wrap: wrap; justify-content: center; white-space: normal; }
  #btn-bar { justify-content: center; }
  #st-spot { display: none; }
  .help-cols { flex-direction: column; }
  .shop-row { flex-direction: column; }
  .sr-act { align-self: flex-end; }
}
.webgl-error { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--c-bg); pointer-events: auto; }
.webgl-error-card { width: min(560px, 92vw); padding: 28px; border: 1px solid #3a5a78; border-radius: 14px; background: #142033; text-align: center; }
.webgl-error-card h2 { margin-bottom: 14px; color: #f4ead2; }
.webgl-error-card p { color: #b8c8d8; line-height: 1.8; margin-bottom: 12px; }
.webgl-error-card button { margin-top: 10px; }

/* ===== 特效 ===== */
#underwater-tint { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 40%, #0a3a2e88); box-shadow: inset 0 0 140px #0a4a3a99; pointer-events: none; display: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flashgo .8s ease-out; }
@keyframes flashgo { 0% { opacity: .85; } 100% { opacity: 0; } }
</style>
</head>

<canvas id="game"></canvas>
<div id="ui-root"></div>
